# Local development: debug mode, code reload (database from DATABASE_URL in .env).
services:
  web:
    user: root
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
    volumes: !override
      - ./backend:/app

  celery:
    user: root
    environment:
      DJANGO_DEBUG: "1"
    volumes: !override
      - ./backend:/app
